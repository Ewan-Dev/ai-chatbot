<html>
    <head>
        <title>AI Chatbot</title>
    </head>
    <style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');        body{
        font-family: "VT323", sans-serif;
        background: #000000;
        color:#ffffff;
        }
        p{
            margin: 0;
        }
        h1,
        input,
        button,
        select{
            font-family: "VT323", monospace;        }
        input:active, 
        input:focus{
              outline: none;
        }
            #message-container{
            height: 30em;
            display: flex;
            flex-direction: column;
            border-radius: 0em;
            background-color: #DDD2CF;
            padding: 6px;
            box-shadow:  inset 0px 3px white , inset -3px -3px #858081, inset 3px 0px white ;
        }
                #loquelis{
            width: 98.6%;
            margin-bottom: 0.25em;
            height: fit-content;
            color:#000;
            border-radius: 0em;
            background-color: #DDD2CF;
            padding: 6px;
            box-shadow:  inset 0px 3px white , inset -3px -3px #858081, inset 3px 0px white ;
        }
        
            #messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0; 
        }
        #form{
            display: flex;
            align-items: center;
            flex-direction: row;
            justify-content: center;
            height: 2em;     
        margin: 0;   }
        #control-bar{
            background-color:#19278B ;
            width: 100%;
            height: 1.25em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 5px;
            box-sizing: border-box;
        }
        #chat-icon{
            height: 3.75em;
            position: relative;
            left:-47.5px;
        }
        #send-message-btn{
            height: 28px;
            margin: 0;
            border: 0;
            margin: 0  0 0 5px ;
            box-shadow:  inset 0px 3px white , inset -3px -3px #858081, inset 3px 0px white ;

        }
                #send-message-btn:active{
            height: 28px;
            margin: 0;
            border: 0;
            margin: 0  0 0 5px ;
            box-shadow:  inset 0px -3px white , inset 3px 3px #858081, inset -3px 0px white ;

        }
        #icon-title{
            display: flex;
            align-items: center;
            justify-content: center;
            height: fit-content;
            width: fit-content;
        }
        #window-title{

            position: relative;
            left:-92.5px;
        }
        #buttons{
            height: 80%;
        }
        select{
            box-sizing: content-box;
            height: 1.5em;
            padding: 0;
            box-sizing: border-box;
            width:100% !important;
                    background-color: #DDD2CF;

            box-shadow:  inset 0px -3px white , inset 3px 3px #858081, inset -3px 0px white ;

        }
        select:active,
        select:focus{
            outline: none;
        }
        input{
            width: 100%;
            border-radius: 0em;
            background-color: #DDD2CF;
            padding: 6px;
            box-shadow:  inset 0px -3px white , inset 3px 3px #858081, inset -3px 0px white ;
        }
        #api_key{
            height: 1.75em;
    
        }
        .bubble{
            background-color: #e6e6e6;
            color: #000000;
            width: fit-content;
            overflow: hidden;
            max-width: 40%;
            height: auto;
            padding: 5px;
            flex-shrink: 0;
            box-shadow:  inset 0px -3px white , inset 3px 3px #858081, inset -3px 0px white ;

        }
        .chat-content{
            overflow-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .alert{
            width: 80%;
            align-self: center;
            height: auto;
            color: red !important;
            max-width:none;
        }
        .user{align-self: flex-end;}
        .assistant{align-self: flex-start;}
        #message-boxes {
            display: flex;
            flex-direction: column;
            gap:0.5em;
            flex: 1;
            min-height: 0;
            height: fit-content;
            
            overflow-y: scroll;
        }
 #message-boxes::-webkit-scrollbar {
  display: none; 
}
    #message-container {
        display: flex;
        flex-direction: column;
            height: 30em;
        overflow: hidden; 
    }
        </style>

    <body>
            <section id="loquelis">ADVERT: Discover <a href="loquelis.com">loquelis.com</a>. A new way to learn languages.</section>

        <section id="message-container">
            <div id="control-bar"><span id="icon-title"><img id="chat-icon" src="/chat.png"><p id="window-title">Confabulari - AI Chatbot</p></span><img id="buttons" src="/buttons.png"></div>
            <input placeholder="Paste API key to get all models and to chat!" id="api_key" type="password">
<select id="select">
    <option value="">No model selected</option>
</select>            
<div id="messages">
                <div id="message-boxes"></div>
            <form  id="form"><input id="input"><button type="submit" id="send-message-btn">Send</button></form>

            </div>
        </section>
    </body>

    <script>
        let messages= []
        const select = document.getElementById("select")
        const input = document.getElementById("input")
        const form = document.getElementById("form")
        const apiKeyInput = document.getElementById("api_key")
        let model = 'llama-3.3-70b-versatile' // default fallback

        messages.push({role: "system", content: "You are a helpful AI assistant."})

            apiKeyInput.addEventListener("change", fetchAllModels)

        function pushMessageToDom(role, content){
            const chatBubble = document.createElement('div');
            const chatContent = document.createElement('p');           
            const messageBoxes = document.getElementById("message-boxes")
            chatContent.textContent = content
            chatContent.classList.add("chat-content")
            chatBubble.classList.add(role)
            chatBubble.classList.add('bubble')
            chatBubble.appendChild(chatContent)

            document.getElementById("message-boxes").appendChild(chatBubble)
            messageBoxes.scrollTop = messageBoxes.scrollHeight
        }
        
        
        form.addEventListener("submit", async (event) => {
            const APIKey = apiKeyInput.value
            event.preventDefault()
            const userText = input.value
            input.value = ""
            console.log(userText)
            const model = select.value

            if (!apiKeyInput.value){
                pushMessageToDom("alert", "No API key detected")
                return
            }
            else if (!userText){
                return
            }
            else if (!model){
                pushMessageToDom("alert", "No model selected")

                return
            }
            messages.push({role: "user", content: userText})
            pushMessageToDom("user",userText )
            try{
                const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method: "POST",
                headers : {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${APIKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: messages,
                })
            })
            const data = await response.json()
            const reply = data?.choices?.[0]?.message?.content || "Could'nt supply a response :("
            messages.push({role: "assistant", content: reply})
            pushMessageToDom("assistant", reply)
            console.log(messages)

            
            }
            catch(err){
                console.error(err)
            }
        })

        async function fetchAllModels(){

            const APIKey = apiKeyInput.value
            const response = await fetch("https://api.groq.com/openai/v1/models", {
                headers : {
                Authorization: `Bearer ${APIKey}`
                }
            })
                const listsData = await response.json()
                listsData.data.forEach(model => {
                    const option = document.createElement("option")
                    option.value = model.id
                    option.textContent = model.id
                    select.appendChild(option)
                    
                })
        }
    </script>
</html>
